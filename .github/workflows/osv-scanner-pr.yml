name: OSV-Scanner PR Scan

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  # Only read repository contents.
  contents: read
  # Required to post or update the sticky scan comment on the PR.
  pull-requests: write

jobs:
  scan:
    # Full scan (not PR-delta): fails on ANY known vulnerability, including pre-existing ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ensuro/github-actions/osv-scanner@main
        with:
          comment: true
          # Keep updating the headerless sticky comment used by the previous workflow.
          comment-header: ""
